syntax = "proto3";

package hoptrace.v1;

option go_package = "hoptrace/api/hoptrace/v1;v1";

enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;
  DEVICE_NOT_FOUND = 1;
  DEVICE_INVALID_ARGUMENT = 2;
  DEVICE_ALREADY_EXISTS = 3;
  CREDENTIAL_NOT_FOUND = 4;
  CREDENTIAL_INVALID_ARGUMENT = 5;
  CREDENTIAL_IN_USE = 6;
  ENDPOINT_NOT_FOUND = 7;
  ENDPOINT_INVALID_ARGUMENT = 8;
  DISCOVERY_NOT_FOUND = 9;
  DISCOVERY_INVALID_ARGUMENT = 10;
  COLLECT_FAILED = 11;
  UNAUTHORIZED = 12;
  FORBIDDEN = 13;
  INVALID_CREDENTIALS = 14;
  USER_NOT_FOUND = 15;
  USER_ALREADY_EXISTS = 16;
}
