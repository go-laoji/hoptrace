syntax = "proto3";

package hoptrace.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

option go_package = "hoptrace/api/hoptrace/v1;v1";

// TopologyService 拓扑查询
service TopologyService {
  rpc GetTopology(GetTopologyRequest) returns (Topology) {
    option (google.api.http) = {get: "/api/v1/topology"};
  }
  // 手动触发拓扑重建与终端同步
  rpc Rebuild(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/v1/topology/rebuild"
      body: "*"
    };
  }
  // 路径追踪: 源(IP/MAC/设备) -> 目标(IP/MAC/设备，留空则追踪到核心/网关)
  rpc TracePath(TracePathRequest) returns (TracePathReply) {
    option (google.api.http) = {get: "/api/v1/topology/trace"};
  }
  // 保存手工微调后的节点坐标
  rpc SaveLayout(SaveLayoutRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/v1/topology/layout"
      body: "*"
    };
  }
  // 重置所有节点自定义坐标
  rpc ResetLayout(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/v1/topology/layout"
    };
  }
}

message GetTopologyRequest {
  // 展开这些设备下的接入终端
  repeated int64 expand_device_ids = 1;
  // 展开全部设备的终端(终端较多时慎用)
  bool include_all_endpoints = 2;
  string site = 3;
}

message TopoNode {
  string id = 1; // d<ID> 设备 / e<ID> 终端
  string kind = 2; // device / endpoint
  int64 ref_id = 3;
  string name = 4;
  string ip = 5;
  string role = 6;
  string family = 7;
  string status = 8;
  string vendor = 9;
  string model = 10;
  string type = 11; // 终端类型
  bool managed = 12;
  int32 endpoint_count = 13;
  double pos_x = 14;
  double pos_y = 15;
  bool has_pos = 16;
}

message TopoLink {
  string id = 1;
  string source = 2;
  string target = 3;
  string source_port = 4;
  string target_port = 5;
  string kind = 6; // lldp / fdb / access
  double confidence = 7;
  string status = 8; // up / down / stale
  repeated string members = 9;
  int64 in_bps = 10;
  int64 out_bps = 11;
  double utilization_pct = 12;
}

message Topology {
  repeated TopoNode nodes = 1;
  repeated TopoLink links = 2;
}

message TracePathRequest {
  string source = 1; // IP / MAC / 设备名
  string target = 2; // 可选，为空则自动追踪到防火墙或核心交换机
}

message PathHop {
  string node_id = 1;
  string kind = 2; // endpoint / device
  string name = 3;
  string ip = 4;
  string role = 5;
  string in_port = 6;
  string out_port = 7;
  string link_id = 8;
}

message TracePathReply {
  bool found = 1;
  string message = 2;
  repeated PathHop hops = 3;
  repeated string node_ids = 4;
  repeated string link_ids = 5;
}

message NodePosition {
  int64 device_id = 1;
  double x = 2;
  double y = 3;
}

message SaveLayoutRequest {
  repeated NodePosition positions = 1;
}
