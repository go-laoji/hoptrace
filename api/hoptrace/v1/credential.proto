syntax = "proto3";

package hoptrace.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

option go_package = "hoptrace/api/hoptrace/v1;v1";

// CredentialService SNMP 凭据管理(密文字段不会回显)
service CredentialService {
  rpc ListCredentials(google.protobuf.Empty) returns (ListCredentialsReply) {
    option (google.api.http) = {get: "/api/v1/credentials"};
  }
  rpc CreateCredential(SaveCredentialRequest) returns (Credential) {
    option (google.api.http) = {
      post: "/api/v1/credentials"
      body: "*"
    };
  }
  rpc UpdateCredential(SaveCredentialRequest) returns (Credential) {
    option (google.api.http) = {
      put: "/api/v1/credentials/{id}"
      body: "*"
    };
  }
  rpc DeleteCredential(DeleteCredentialRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/v1/credentials/{id}"};
  }
}

message Credential {
  int64 id = 1;
  string name = 2;
  string version = 3; // v2c / v3
  string username = 4;
  string auth_protocol = 5; // MD5 / SHA / SHA224 / SHA256 / SHA384 / SHA512
  string priv_protocol = 6; // DES / AES / AES192 / AES256
  int32 port = 7;
  bool has_community = 8;
  bool has_auth_password = 9;
  bool has_priv_password = 10;
  int64 created_at = 11;
}

message SaveCredentialRequest {
  int64 id = 1;
  string name = 2;
  string version = 3;
  string community = 4; // 空表示保持不变
  string username = 5;
  string auth_protocol = 6;
  string auth_password = 7; // 空表示保持不变
  string priv_protocol = 8;
  string priv_password = 9; // 空表示保持不变
  int32 port = 10;
}

message ListCredentialsReply {
  repeated Credential items = 1;
}
message DeleteCredentialRequest {
  int64 id = 1;
}
