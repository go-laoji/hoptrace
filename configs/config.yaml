server:
  http:
    addr: 0.0.0.0:8000
    timeout: 30s
  grpc:
    addr: 0.0.0.0:9000
    timeout: 30s
  # 前端构建完成后可填写 web/dist 由后端直接托管
  static_dir: web/dist

data:
  database:
    # 开发/演示使用 sqlite; 生产环境改为 postgres 并通过环境变量注入 DSN
    driver: ${DATABASE_DRIVER:sqlite}
    source: ${DATABASE_SOURCE:data/hoptrace.db}
    debug: false
    auto_migrate: true

collector:
  poll_interval: 300s
  concurrency: 20
  timeout: 3s
  retries: 1
  max_repetitions: 25
  # true: 使用内置华为风格模拟网络(10.255.0.0/24), 方便无真机联调
  # false: 使用真实 SNMP(gosnmp) 采集现网设备
  simulate: true
  disable_poller: false
  suspect_mac_threshold: 30
  offline_miss_rounds: 2
  move_confirm_rounds: 2
  # SNMP Trap 监听地址(接收 linkUp/linkDown 触发增量重扫); 留空则关闭
  trap_addr: ${TRAP_ADDR:0.0.0.0:1162}
  trap_debounce: 15s
  # UDP Syslog 监听地址(接收华为端口安全/环路/登录审计日志); 留空则关闭
  syslog_addr: ${SYSLOG_ADDR:0.0.0.0:1514}
  # 设备运行配置自动备份周期(86400s = 每天一次); 0s 关闭自动备份
  backup_interval: 86400s

security:
  # 生产环境请通过 HOPTRACE_SECURITY_SECRET_KEY 环境变量注入
  secret_key: ${SECURITY_SECRET_KEY:hoptrace-dev-secret-change-me}
  # 开启后所有 /api/v1/* (除 /api/v1/auth/login) 需要 JWT 鉴权与 RBAC 校验
  auth_enabled: false
  jwt_ttl: 86400s
  init_admin_user: ${INIT_ADMIN_USER:admin}
  init_admin_password: ${INIT_ADMIN_PASSWORD:admin123}
