            properties:
                nodes:
                    type: array
                    items:
                        $ref: '#/components/schemas/hoptrace.v1.TopoNode'
                links:
                    type: array
                    items:
                        $ref: '#/components/schemas/hoptrace.v1.TopoLink'
        hoptrace.v1.TracePathReply:
            type: object
            properties:
                found:
                    type: boolean
                message:
                    type: string
                hops:
                    type: array
                    items:
                        $ref: '#/components/schemas/hoptrace.v1.PathHop'
                nodeIds:
                    type: array
                    items:
                        type: string
                linkIds:
                    type: array
                    items:
                        type: string
        hoptrace.v1.UpdateDeviceRequest:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                credentialId:
                    type: string
                role:
                    type: string
                site:
                    type: string
                location:
                    type: string
        hoptrace.v1.UpdateEndpointRequest:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                owner:
                    type: string
                tags:
                    type: array
                    items:
                        type: string
                trust:
                    type: string
                type:
                    type: string
                remark:
                    type: string
        hoptrace.v1.User:
            type: object
            properties:
                id:
                    type: string
                username:
                    type: string
                displayName:
                    type: string
                role:
                    type: string
                createdAt:
                    type: string
        hoptrace.v1.WriteCredential:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                protocol:
                    type: string
                username:
                    type: string
                port:
                    type: integer
                    format: int32
                hasPassword:
                    type: boolean
                nacWebhookUrl:
                    type: string
                createdAt:
                    type: string
tags:
    - name: AlertService
      description: AlertService 实时告警中心、Webhook 通知渠道与 Syslog 日志查询
    - name: AuthService
      description: AuthService 登录鉴权与用户管理(RBAC)
    - name: BackupService
      description: BackupService 设备运行配置定时备份与版本 Diff
    - name: ControlService
      description: ControlService 设备端口管控、终端封禁审批流与回滚(M2)
    - name: CredentialService
      description: CredentialService SNMP 凭据管理(密文字段不会回显)
    - name: DashboardService
      description: DashboardService 仪表盘统计
    - name: DeviceService
      description: DeviceService 设备管理
    - name: DiscoveryService
      description: DiscoveryService 设备发现任务
    - name: EndpointService
      description: EndpointService 终端管理
    - name: IpamService
      description: IpamService IP 地址管理与异常检测(IP 冲突 / 私接小交换机 / MAC 多口漂移)
    - name: TopologyService
      description: TopologyService 拓扑查询
