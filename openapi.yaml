                    description: OK
                    content: {}
        delete:
            tags:
                - TopologyService
            description: 重置所有节点自定义坐标
            operationId: TopologyService_ResetLayout
            responses:
                "200":
                    description: OK
                    content: {}
    /api/v1/topology/rebuild:
        post:
            tags:
                - TopologyService
            description: 手动触发拓扑重建与终端同步
            operationId: TopologyService_Rebuild
            requestBody:
                content:
                    application/json: {}
                required: true
            responses:
                "200":
                    description: OK
                    content: {}
    /api/v1/topology/trace:
        get:
            tags:
                - TopologyService
            description: '路径追踪: 源(IP/MAC/设备) -> 目标(IP/MAC/设备，留空则追踪到核心/网关)'
            operationId: TopologyService_TracePath
            parameters:
                - name: source
                  in: query
                  schema:
                    type: string
                - name: target
                  in: query
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hoptrace.v1.TracePathReply'
    /api/v1/users:
        get:
            tags:
                - AuthService
            operationId: AuthService_ListUsers
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hoptrace.v1.ListUsersReply'
