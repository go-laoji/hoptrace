<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="ht-bg" x1="12" y1="8" x2="116" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1677FF"/>
      <stop offset="55%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#722ED1"/>
    </linearGradient>
    <linearGradient id="ht-hop" x1="34" y1="78" x2="94" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#5EEAD4"/>
    </linearGradient>
    <filter id="ht-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded app badge -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#ht-bg)"/>
  <rect x="6.75" y="6.75" width="114.5" height="114.5" rx="27.25" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>

  <!-- Subtle topology grid rings -->
  <circle cx="64" cy="64" r="44" stroke="rgba(255,255,255,0.10)" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- Stylized 'H' backbone links -->
  <path d="M36 34V94" stroke="rgba(255,255,255,0.92)" stroke-width="8" stroke-linecap="round"/>
  <path d="M92 34V94" stroke="rgba(255,255,255,0.92)" stroke-width="8" stroke-linecap="round"/>

  <!-- Hop trace arc across the 'H' bridge -->
  <path d="M36 64 C 50 42, 78 86, 92 64" stroke="url(#ht-hop)" stroke-width="7" stroke-linecap="round" fill="none" filter="url(#ht-glow)"/>

  <!-- Network nodes (Core / Access / Endpoints) -->
  <circle cx="36" cy="34" r="8.5" fill="#FFFFFF"/>
  <circle cx="36" cy="34" r="4" fill="#1677FF"/>

  <circle cx="36" cy="94" r="8.5" fill="#FFFFFF"/>
  <circle cx="36" cy="94" r="4" fill="#4F46E5"/>

  <circle cx="92" cy="34" r="8.5" fill="#FFFFFF"/>
  <circle cx="92" cy="34" r="4" fill="#722ED1"/>

  <circle cx="92" cy="94" r="8.5" fill="#FFFFFF"/>
  <circle cx="92" cy="94" r="4" fill="#06B6D4"/>

  <!-- Active trace hop midpoint -->
  <circle cx="64" cy="64" r="7" fill="#38BDF8" stroke="#FFFFFF" stroke-width="3"/>
</svg>
